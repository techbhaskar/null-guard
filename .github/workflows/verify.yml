name: Verify NullGuard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode clean install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: python scripts/smoke_entrypoints.py
      - run: python scripts/validate_sarif.py nullguard-cli/target/ci-reports/nullguard-results.sarif
      - run: python scripts/summarize_coverage.py --min-instruction=80 --min-branch=60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-${{ matrix.os }}-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            nullguard-coverage/target/site/jacoco-aggregate/**
            nullguard-cli/target/ci-reports/**
            examples/orders-service/target/nullguard/**
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode verify -Dnullguard.benchmark=true
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: nullguard-maven-plugin/target/benchmark.json
