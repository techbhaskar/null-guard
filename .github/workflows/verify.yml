name: Verify NullGuard
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      large_benchmark:
        description: Run the synthetic benchmark through 50,000 methods
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode clean install
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0 openapi-spec-validator==0.7.2
      - run: python scripts/validate_openapi.py nullguard-engine/target/openapi-validation/variants.json nullguard-engine/target/openapi-validation/schemas.json nullguard-engine/target/openapi-validation/configured.json nullguard-engine/target/openapi-validation/responses.json
      - run: python scripts/smoke_entrypoints.py
      - run: python scripts/validate_openapi.py nullguard-cli/target/ci-reports/nullguard-openapi.json
      - run: python scripts/validate_sarif.py nullguard-cli/target/ci-reports/nullguard-results.sarif
      - run: python scripts/summarize_coverage.py --min-instruction=80 --min-branch=60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-${{ matrix.os }}-${{ matrix.java }}
          path: |
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            nullguard-coverage/target/site/jacoco-aggregate/**
            nullguard-cli/target/ci-reports/**
            examples/orders-service/target/nullguard/**
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Benchmark (smoke by default, 50k on manual request)
        env:
          LARGE_BENCHMARK: ${{ inputs.large_benchmark || false }}
          JAVA_TOOL_OPTIONS: -Xmx6g
        run: |
          sizes=10,100,500
          if [ "$LARGE_BENCHMARK" = "true" ]; then
            sizes=10,100,500,1000,5000,10000,25000,50000
          fi
          mvn --batch-mode verify -Dnullguard.benchmark=true -Dnullguard.benchmark.sizes="$sizes"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: nullguard-engine/target/benchmark.json

  gradle-integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
        gradle: ['8.14.4', '9.7.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle
          cache-dependency-path: nullguard-gradle-plugin/*.gradle.kts
      - name: Verify Gradle integration
        working-directory: nullguard-gradle-plugin
        run: ./gradlew check --no-daemon -PtestGradleVersion=${{ matrix.gradle }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-integration-${{ matrix.gradle }}-java-${{ matrix.java }}
          path: nullguard-gradle-plugin/build/reports/**
