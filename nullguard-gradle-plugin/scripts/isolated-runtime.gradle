// Compatibility entry point: use the matching local plugin and isolated CLI,
// including direct analysis of original sources (no source staging).
// Run: ./gradlew -I /path/to/null-guard/nullguard-gradle-plugin/scripts/isolated-runtime.gradle nullguard
File initFile = gradle.startParameter.initScripts.find { it.name == 'isolated-runtime.gradle' }
if (initFile == null) throw new GradleException('Cannot locate isolated-runtime.gradle in the supplied init scripts')
File checkout = initFile.canonicalFile.parentFile.parentFile.parentFile
gradle.ext.nullguardDevelopmentCheckout = checkout.absolutePath
logger.lifecycle('NullGuard development runtime: original project sources (no staging)')
apply from: new File(checkout, 'nullguard-gradle-plugin/scripts/development-runtime.gradle')
