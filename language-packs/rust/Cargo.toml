[package]
name = "nullguard-rust"
version = "2.0.0-preview.1"
edition = "2024"
rust-version = "1.85"
[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cargo_metadata = "0.23"
